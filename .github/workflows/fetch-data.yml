name: 每日抓取並更新網頁

on:
  workflow_dispatch:
  schedule:
    - cron: "30 07 * * 1-5" # 台灣時間 15:30

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 建立 data 目錄
        run: mkdir -p data

      - name: 抓取最新報價與掛牌資料
        run: |
          curl -s -o data/emerging-latest.json "https://www.tpex.org.tw/openapi/v1/tpex_esb_latest_statistics"
          curl -s -o data/ipo.json "https://www.tpex.org.tw/openapi/v1/tpex_esb_registration_announcements"

      - name: 存回資料庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 建立昨日快照 (如果今天有抓到資料)
          if [ -s data/emerging-latest.json ]; then
            cp data/emerging-latest.json data/emerging-prev.json
          fi
          
          git add data/*.json
          git commit -m "📉 自動更新資料庫: $(date +'%Y-%m-%d %H:%M')" || echo "無變更"
          git push origin main

      - name: 設定 Pages
        uses: actions/configure-pages@v4

      - name: 上傳網頁檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
